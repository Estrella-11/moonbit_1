name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  moonbit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Show toolchain
        run: moon version

      - name: Check
        run: moon check

      - name: Test
        run: moon test

      - name: Interface output is current
        run: |
          moon info
          git diff --exit-code

      - name: Formatting is current
        run: |
          moon fmt
          git diff --exit-code

      - name: Run demo
        run: moon run cmd/main

      - name: Check JavaScript target
        run: moon check --target js

      - name: Build playground bundle
        run: moon build --target js cmd/playground

      - name: Test playground bundle in Node
        run: node tools/test_playground_js.mjs _build/js/debug/build/cmd/playground/playground.js

      - name: Documented examples are current
        run: |
          moon run --target js cmd/moondockit --source examples/doctest --output _doctest_site --title "Doc Test Source" --doctest-output doctests/doc_examples_test.mbt --doctest-package "Estrella-11/moondockit"
          git diff --exit-code doctests/doc_examples_test.mbt

      - name: Test compiled CLI
        run: python tools/test_cli.py

      - name: One-shot verification
        run: python tools/verify_project.py

      - name: Build example site with MoonBit CLI
        run: >
          moon run --target js cmd/moondockit
          --source examples/site
          --api pkg.generated.mbti
          --output dist-cli-example
          --title "MoonDocKit CLI Example"
          --site-url https://example.com/moondockit-cli
          --language en
          --description "MoonDocKit end-to-end CLI example"
          --footer 'Built and verified by `MoonDocKit`'

      - name: Verify generated showcase
        run: |
          test -f dist-cli-example/api-reference.html
          test -f dist-cli-example/overview.html
          test -f dist-cli-example/quality.html
          test -f dist-cli-example/deployment.html
          grep -q "MoonBit API" dist-cli-example/api-reference.html
          grep -q "parse_mbti" dist-cli-example/api-reference.html
          grep -q "data-search-input" dist-cli-example/overview.html
          grep -q "search-index.json" dist-cli-example/overview.html
          grep -q 'name="description" content="MoonDocKit end-to-end CLI example"' dist-cli-example/overview.html
          grep -q "Built and verified by" dist-cli-example/overview.html

      - name: Build with full AI suite
        run: >
          moon run --target js cmd/moondockit
          --source examples/site
          --api pkg.generated.mbti
          --output dist-ai-example
          --ai-doc
          --ai-quality
          --ai-summary
          --ai-xref
          --ai-coverage
          --ai-consistency
          --ai-seo
          --ai-recommend
          --ai-tests
          --title "MoonDocKit AI Full"
          --site-url https://example.com/moondockit-ai
          --language en
          --description "MoonDocKit with full AI suite"
          --footer 'AI-enhanced by MoonDocKit'

      - name: Verify AI output files
        run: |
          test -f dist-ai-example/ai-api-reference.html
          test -f dist-ai-example/ai-quality-report.md
          test -f dist-ai-example/ai-site-quality-report.md
          test -f dist-ai-example/ai-site-summary.md
          test -f dist-ai-example/ai-cross-reference.md
          test -f dist-ai-example/ai-coverage-report.md
          test -f dist-ai-example/ai-consistency-report.md
          test -f dist-ai-example/ai-seo-report.md
          test -f dist-ai-example/ai-recommendations.md
          test -f dist-ai-example/ai-generated-test.mbt
          grep -q "Quality Assessment" dist-ai-example/ai-quality-report.md
          grep -q "Cross-Reference" dist-ai-example/ai-cross-reference.md
          grep -q "Coverage" dist-ai-example/ai-coverage-report.md
          grep -q "Consistency" dist-ai-example/ai-consistency-report.md
          grep -q "SEO" dist-ai-example/ai-seo-report.md
          grep -q "Recommendations" dist-ai-example/ai-recommendations.md
