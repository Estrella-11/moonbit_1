name: Deploy showcase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Build showcase with MoonBit CLI
        run: >
          moon run --target js cmd/moondockit
          --source examples/site
          --api pkg.generated.mbti
          --output dist-showcase
          --title "MoonDocKit"
          --site-url "https://estrella-11.github.io/moonbit_1"

      - name: Verify generated MoonBit API
        run: |
          test -f dist-showcase/api-reference.html
          grep -q "MoonBit API" dist-showcase/api-reference.html
          grep -q "parse_mbti" dist-showcase/api-reference.html
          grep -q "api-reference.html" dist-showcase/search-index.json
          {
            echo "## MoonDocKit showcase"
            echo
            echo "- Generated files: $(find dist-showcase -maxdepth 1 -type f | wc -l)"
            echo "- MoonBit API: \`api-reference.html\`"
            echo "- Source interface: \`pkg.generated.mbti\`"
            echo
            echo "### Artifact contents"
            find dist-showcase -maxdepth 1 -type f -printf '%f\n' | sort | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-showcase

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
